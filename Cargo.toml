[package]
name = "dope-amqp091"
version.workspace = true
edition = "2024"
rust-version.workspace = true
authors = ["inq <gofiri@gmail.com>"]
description = "Manifold-native AMQP 0-9-1 protocol core for dope"
license = "MIT"
repository = "https://github.com/dope-rs/amqp091"
readme = "README.md"

[workspace]
members = ["fiber"]
resolver = "2"

[workspace.package]
version = "0.28.0"
rust-version = "1.98"

[dependencies]
dope = "0.32"
o3 = "0.35.0"

[dev-dependencies]
dope-test = "0.32"

[profile.release]
panic = "abort"
